site_name: Aquamatrix SIMAR Python SDK
site_description: Async Python client for SIMAR customer accounts on Aquamatrix
site_url: https://oldemarjesus.github.io/aquamatrix-python-sdk/
repo_url: https://github.com/OldemarJesus/aquamatrix-python-sdk
repo_name: OldemarJesus/aquamatrix-python-sdk

theme:
  name: material
  features:
    - content.code.copy
    - navigation.footer
    - navigation.sections
    - navigation.tabs
    - search.highlight
    - search.suggest
  palette:
    - scheme: default
      primary: teal
      accent: amber

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            members_order: source
            show_root_heading: true
            show_source: false

nav:
  - Home: index.md
  - Guide:
      - Installation: guide/installation.md
      - Quick start: guide/quickstart.md
      - Integrations: guide/integrations.md
      - Security and limitations: guide/security.md
  - API reference: api.md
  - Project:
      - Product requirements: https://github.com/OldemarJesus/aquamatrix-python-sdk/blob/main/PRD.md
      - Architecture: https://github.com/OldemarJesus/aquamatrix-python-sdk/blob/main/ARCH.md
      - License: https://github.com/OldemarJesus/aquamatrix-python-sdk/blob/main/LICENSE
      - Release and publishing: guide/releasing.md

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences

strict: true